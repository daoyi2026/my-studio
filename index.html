<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#11120f" />
  <title>DAOYI’s ROOM</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://bloom-blossom-garden.lovable.app" crossorigin />
  <link rel="dns-prefetch" href="//bloom-blossom-garden.lovable.app" />
  <link rel="stylesheet" href="./src/styles.css?v=29" />
  <link rel="stylesheet" href="./src/intro/intro-loader.css?v=6" />
  <script type="importmap">
    {
      "imports": {
        "three": "./public/vendor/three/three.module.js",
        "three/addons/": "./public/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app" data-mode="night" data-level="global">
    <div id="screen-layer" aria-label="Device screens"></div>
    <div id="webgl-layer"></div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="Return to global view">
        <span class="brand-mark">R</span>
        <span><strong>DAOYI’s ROOM</strong><em>SUMMER 2026</em></span>
      </a>
      <nav>
        <button id="mode-toggle" class="pill" type="button" data-action="day" aria-label="Switch to day mode" title="Switch to day mode"><svg class="mode-icon mode-icon-sun" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M25.2 6.8l-2.8 2.8M9.6 22.4l-2.8 2.8"/></svg><svg class="mode-icon mode-icon-moon" viewBox="0 0 32 32" aria-hidden="true"><path d="M24.5 21.6A10.5 10.5 0 0 1 10.4 7.5 10.5 10.5 0 1 0 24.5 21.6Z"/></svg></button>
        <button id="reset-view" class="icon-button" type="button" aria-label="Return to global view" title="Return to global view"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15 16 5l11 10M8 14v13h16V14M13 27v-7h6v7"/></svg></button>
      </nav>
    </header>

    <section id="interaction-panel" class="interaction-panel" hidden aria-live="polite">
      <div class="panel-backdrop" aria-hidden="true"></div>
      <button class="panel-close" type="button" aria-label="Close panel">⋯</button>
      <div class="panel-content"></div>
    </section>

    <section id="loader" class="intro-loader" aria-label="Organizing room" aria-live="polite" aria-busy="true">
      <div data-intro-line-art aria-hidden="true"></div>
      <div data-intro-progress aria-live="polite">
        <span data-intro-progress-label>ORGANIZING ROOM</span>
        <span data-intro-percent>0%</span>
      </div>
      <p data-intro-status hidden></p>
      <p data-intro-error hidden></p>
      <button type="button" data-intro-retry hidden>RETRY</button>
      <aside data-intro-debug hidden aria-label="Intro loader debug">
        <p><span>state</span><span data-intro-debug-value="state"></span></p>
        <p><span>progress</span><span data-intro-debug-value="progress"></span></p>
        <p><span>paths</span><span data-intro-debug-value="paths"></span></p>
        <p><span>line</span><span data-intro-debug-value="line"></span></p>
        <p><span>scene</span><span data-intro-debug-value="scene"></span></p>
        <p><span>warmup</span><span data-intro-debug-value="warmup"></span></p>
        <p><span>motion</span><span data-intro-debug-value="motion"></span></p>
        <p><span>slow</span><span data-intro-debug-value="slow"></span></p>
        <p><span>source</span><span data-intro-debug-value="source"></span></p>
        <p><span>elapsed</span><span data-intro-debug-value="elapsed"></span></p>
      </aside>
    </section>

    <div id="cursor" class="cursor" aria-hidden="true"></div>
  </div>
  <script type="module" src="./src/main.js?v=86"></script>
</body>
</html>

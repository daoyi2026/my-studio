<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#11120f" />
  <title>DAOYI’s ROOM</title>
  <link rel="icon" href="data:," />
  <link rel="preconnect" href="https://bloom-blossom-garden.lovable.app" crossorigin />
  <link rel="dns-prefetch" href="//bloom-blossom-garden.lovable.app" />
  <link rel="stylesheet" href="./src/styles.css?v=27" />
  <script type="importmap">
    {
      "imports": {
        "three": "./public/vendor/three/three.module.js",
        "three/addons/": "./public/vendor/three/addons/"
      }
    }
  </script>
</head>
<body>
  <div id="app" data-mode="night" data-level="global">
    <div id="screen-layer" aria-label="Device screens"></div>
    <div id="webgl-layer"></div>

    <header class="topbar">
      <a class="brand" href="#" aria-label="Return to global view">
        <span class="brand-mark">R</span>
        <span><strong>DAOYI’s ROOM</strong><em>A room that about me</em></span>
      </a>
      <nav>
        <button id="mode-toggle" class="pill" type="button" data-action="day" aria-label="Switch to day mode" title="Switch to day mode"><svg class="mode-icon mode-icon-sun" viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="5"/><path d="M16 3v4M16 25v4M3 16h4M25 16h4M6.8 6.8l2.8 2.8M22.4 22.4l2.8 2.8M25.2 6.8l-2.8 2.8M9.6 22.4l-2.8 2.8"/></svg><svg class="mode-icon mode-icon-moon" viewBox="0 0 32 32" aria-hidden="true"><path d="M24.5 21.6A10.5 10.5 0 0 1 10.4 7.5 10.5 10.5 0 1 0 24.5 21.6Z"/></svg></button>
        <button id="reset-view" class="icon-button" type="button" aria-label="Return to global view" title="Return to global view"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M5 15 16 5l11 10M8 14v13h16V14M13 27v-7h6v7"/></svg></button>
      </nav>
    </header>

    <p class="room-tagline">A softer corner of the internet.<i aria-hidden="true"></i></p>

    <aside class="climate" aria-label="Room status">
      <span>SHENZHEN · SUMMER 2026</span>
    </aside>

    <aside class="light-controls" aria-label="Local lights">
      <button data-light="desk" type="button" aria-label="Toggle desk lamp" aria-pressed="true" title="Desk lamp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M8 14h12l-3-7h-6zM14 14v9M9 25h10"/></svg></button>
      <button data-light="floor" type="button" aria-label="Toggle floor lamp" aria-pressed="true" title="Floor lamp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M10 11h12l-3-6h-6zM16 11v14M10 27h12"/></svg></button>
      <button data-light="drawing" type="button" aria-label="Toggle drawing lamp" aria-pressed="true" title="Drawing lamp"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M7 23h8l-2-5H9zM12 18l7-8M18 9l5 4M21 12l-4 13M13 27h10"/></svg></button>
    </aside>

    <p class="hint" id="hint">Click a room area to explore · Scroll to dolly · Drag to orbit</p>
    <p class="tech-mark">THREE.JS · THREE-LEVEL CAMERA</p>

    <section id="interaction-panel" class="interaction-panel" hidden aria-live="polite">
      <div class="panel-backdrop" aria-hidden="true"></div>
      <button class="panel-close" type="button" aria-label="Close panel">⋯</button>
      <div class="panel-content"></div>
    </section>

    <section id="loader" class="loader" aria-label="Arranging the room" aria-live="polite" aria-busy="true">
      <div class="loader-copy">
        <div class="liquid-title" id="liquid-title" role="heading" aria-level="1">
          <span class="outline">DAOYI’s ROOM</span>
        </div>
        <div class="loader-progress" id="loader-progress" role="progressbar" aria-label="Room loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><i id="loader-progress-fill"></i></div>
        <div class="loader-meta">
          <p id="loader-status">Arranging the room</p>
          <p><span id="loader-percent">0</span>%</p>
        </div>
      </div>
    </section>

    <div id="cursor" class="cursor" aria-hidden="true"></div>
  </div>
  <script type="module" src="./src/main.js?v=61"></script>
</body>
</html>

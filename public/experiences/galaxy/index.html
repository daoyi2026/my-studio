<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>数字银河</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02030a;color:white;font-family:ui-sans-serif,-apple-system,sans-serif}canvas{width:100%;height:100%;display:block}.copy{position:fixed;left:34px;top:30px;pointer-events:none}.copy h1{margin:0;font:500 clamp(24px,4vw,58px) Georgia,serif}.copy p{margin:9px 0 0;color:rgba(255,255,255,.48);letter-spacing:.13em;font-size:11px}.exit{position:fixed;right:28px;top:26px;width:48px;height:48px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:rgba(10,12,25,.4);color:white;font-size:24px;cursor:pointer;backdrop-filter:blur(12px)}
  </style>
</head>
<body>
  <canvas></canvas>
  <div class="copy"><h1>Digital Galaxy</h1><p>MOVE TO BEND THE STARS · CLICK TO CREATE A CONSTELLATION</p></div>
  <button class="exit" aria-label="返回房间">×</button>
  <script>
    const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');let w,h,dpr,stars=[],mouse={x:0,y:0,active:false};
    function resize(){dpr=Math.min(devicePixelRatio,2);w=innerWidth;h=innerHeight;canvas.width=w*dpr;canvas.height=h*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);stars=Array.from({length:Math.min(900,Math.floor(w*h/1500))},()=>({x:Math.random()*w,y:Math.random()*h,z:Math.random(),r:.25+Math.random()*1.2,s:.04+Math.random()*.18}));}
    function draw(t){ctx.fillStyle='rgba(2,3,10,.2)';ctx.fillRect(0,0,w,h);const gx=w*.58+Math.sin(t*.00008)*w*.08,gy=h*.47;const grad=ctx.createRadialGradient(gx,gy,0,gx,gy,Math.max(w,h)*.55);grad.addColorStop(0,'rgba(90,115,190,.12)');grad.addColorStop(.45,'rgba(70,43,115,.08)');grad.addColorStop(1,'transparent');ctx.fillStyle=grad;ctx.fillRect(0,0,w,h);for(const s of stars){s.y-=s.s*(.5+s.z);if(s.y<0)s.y=h;const dx=mouse.active?(mouse.x-w/2)*.018*s.z:0,dy=mouse.active?(mouse.y-h/2)*.018*s.z:0;ctx.beginPath();ctx.fillStyle=`rgba(${185+s.z*70},${200+s.z*50},255,${.3+s.z*.65})`;ctx.arc(s.x+dx,s.y+dy,s.r*(.55+s.z),0,Math.PI*2);ctx.fill();}requestAnimationFrame(draw)}
    addEventListener('resize',resize);addEventListener('pointermove',e=>{mouse={x:e.clientX,y:e.clientY,active:true}});addEventListener('pointerleave',()=>mouse.active=false);document.querySelector('.exit').onclick=()=>parent.postMessage('exit-galaxy','*');resize();requestAnimationFrame(draw);
  </script>
</body>
</html>
